name: feeds
# Daily refresh of the public feeds the Worker reads at runtime (deploy/fresh-feeds.ts):
# MetaMask eth-phishing-detect and the OFAC SDN digital currency addresses.
#
# build:   regenerate the data with the repository scripts, test it, package it.
#          Read-only token, no persisted credentials, no dependency install scripts.
# publish: compare the new manifest with the published one and refuse an implausible
#          change (scripts/feeds-guard.mjs, checked out from this run's commit, never
#          taken from the artifact), then sign the manifest (Ed25519; the Worker pins the
#          public key) and push it as the single commit of the `feeds` branch. Runs no
#          dependency code at all: plain node and the runner's own tools.
# `main` is never modified. ScamSniffer (GPL) is never published here.
#
# Supply chain: every action is pinned to a full commit SHA (the comment names its
# release; Dependabot proposes bumps). This matters most in `publish`, the only job that
# receives FEEDS_SIGNING_KEY and a token that can push.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      override:
        description: "Publish even though the feeds guard refused (only after reviewing the reasons it printed)"
        type: boolean
        default: false
permissions: {}
concurrency:
  group: feeds
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Regenerate OFAC and MetaMask data
        run: |
          npx tsx scripts/update-ofac.ts
          npx tsx scripts/update-threat-feeds.ts
      - name: The refreshed data must pass the test suite
        run: npm test
      - run: npx tsx scripts/publish-feeds.ts feeds-out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: feeds
          path: feeds-out
          retention-days: 3
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # FEEDS_SIGNING_KEY is a secret of the `feeds` environment, which only main may use.
    environment: feeds
    permissions:
      contents: write
    steps:
      # Only the guard, from this run's commit: the artifact comes from a job that ran dependency code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/feeds-guard.mjs
          sparse-checkout-cone-mode: false
          path: trusted
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: feeds
          path: feeds-out
      - name: Refuse an implausible change (compared with the published manifest)
        env:
          GH_TOKEN: ${{ github.token }}
          FEEDS_GUARD_OVERRIDE: ${{ inputs.override && '1' || '' }}
        # The API, not the raw CDN, which can serve a stale copy. No published manifest is a refusal.
        run: |
          curl -fsS --retry 3 -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github.raw" \
            -o published-manifest.json "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/manifest.json?ref=feeds" \
            || rm -f published-manifest.json
          node trusted/scripts/feeds-guard.mjs feeds-out/manifest.json published-manifest.json
      - name: Sign the manifest
        env:
          FEEDS_SIGNING_KEY: ${{ secrets.FEEDS_SIGNING_KEY }}
        run: |
          node -e 'const c=require("node:crypto"),fs=require("node:fs");const key=c.createPrivateKey(process.env.FEEDS_SIGNING_KEY);const m=fs.readFileSync("feeds-out/manifest.json");fs.writeFileSync("feeds-out/manifest.sig",c.sign(null,m,key).toString("base64url"));'
      - name: Publish to the feeds branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd feeds-out
          git init -q -b feeds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "feeds: $(jq -r '.metamask.as_of + " MetaMask, " + .ofac.publish_date + " OFAC"' manifest.json)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" feeds
          echo "published: $(jq -c '{metamask: .metamask.as_of, entries: .metamask.entries, ofac: .ofac.publish_date, addresses: .ofac.addresses}' manifest.json)"
