name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  provider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - name: production dependency audit
        run: npm audit --omit=dev --audit-level=high
  snap:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: snap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: snap/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
