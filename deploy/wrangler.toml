name = "x402check"
main = "worker.ts"
compatibility_date = "2026-09-01"
# Single canonical origin (x402check.xyz): no workers.dev or preview entrypoints that
# would sidestep zone-level rules.
workers_dev = false
preview_urls = false

routes = [
  { pattern = "x402check.xyz", custom_domain = true }
]

[[kv_namespaces]]
binding = "RATE"
id = "47c8f208cb1e498e81b8dc2dc15a968c"

[vars]
PROVIDER_HOST = "x402check.xyz"
PAY_TO_EVM = "0xbF88b1F49B5e8Ec386289341c4a5ee00bB0E0178"
PAY_TO_SOL = "Bofhoe2ye2adNQwZJtLepeKrBZq8CtHzRwPJXgWDH69X"

# Secrets to set before deploy (do NOT commit):
#   wrangler secret put AI_GATEWAY_API_KEY      (or TYPESAFE_API_KEY)
#   wrangler secret put JEV_ATTEST_PRIVATE_KEY  (PEM, sec1 EC P-256 — keep the JWKS stable)
#
# did:web identity path:
#   1. deploy with PROVIDER_HOST = <your-domain>
#   2. route /.well-known/jwks.json on that domain (worker route or reverse proxy)
#   3. the provider DID becomes did:web:<your-domain>, verifiable by any resource server
#   4. publish the discovery doc URL in your x402 PaymentRequired extensions

# v1 created the free-tier quota counter; v2 deletes it (v0.3 removed the free tier).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateCounter"]

[[migrations]]
tag = "v2"
deleted_classes = ["RateCounter"]

# Embedded threat-feed hash sets (src/data/*.bin) are bundled as ArrayBuffer Data modules.
# Keep this table LAST: TOML keys written after a [[table]] header belong to that table.
[[rules]]
type = "Data"
globs = ["**/*.bin"]
fallthrough = false
