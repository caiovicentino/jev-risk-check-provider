name = "x402check"
main = "worker.ts"
compatibility_date = "2026-09-01"
# Single canonical origin (x402check.xyz): no workers.dev or preview entrypoints that
# would sidestep zone-level rules.
workers_dev = false
preview_urls = false

routes = [
  { pattern = "x402check.xyz", custom_domain = true }
]

# Kit watch (deploy/kit-watch.ts): every minute, scan the new Ethereum and Base blocks.
# A run parses ~20 MB of block JSON (tens to hundreds of ms of CPU): Workers Paid only;
# on the Free plan's 10 ms the runs end in exceededCpu (evaluations are unaffected).
[triggers]
crons = ["* * * * *"]

[limits]
cpu_ms = 30000

[[kv_namespaces]]
binding = "RATE"
id = "47c8f208cb1e498e81b8dc2dc15a968c"

[vars]
PROVIDER_HOST = "x402check.xyz"
PAY_TO_EVM = "0xbF88b1F49B5e8Ec386289341c4a5ee00bB0E0178"
PAY_TO_SOL = "Bofhoe2ye2adNQwZJtLepeKrBZq8CtHzRwPJXgWDH69X"

# Secrets to set before deploy (do NOT commit):
#   wrangler secret put AI_GATEWAY_API_KEY      (or TYPESAFE_API_KEY)
#   wrangler secret put JEV_ATTEST_PRIVATE_KEY  (PEM, EC P-256)
#   wrangler secret put JEV_ATTEST_PUBLIC_JWK   (its public JWK with a kid; both are required:
#                                                on x402check.xyz a missing or mismatched pair
#                                                refuses paid work, see /healthz)
#   wrangler secret put JEV_ATTEST_NEXT_PUBLIC_JWK (optional: the next key, published in
#                                                jwks.json and did.json ahead of a rotation)
#   wrangler secret put CDP_API_KEY_ID / CDP_API_KEY_SECRET (Coinbase CDP facilitator)
#
# did:web identity path:
#   1. deploy with PROVIDER_HOST = <your-domain>
#   2. route /.well-known/jwks.json on that domain (worker route or reverse proxy)
#   3. the provider DID becomes did:web:<your-domain>, verifiable by any resource server
#   4. publish the discovery doc URL in your x402 PaymentRequired extensions

# Prepaid credit ledgers (deploy/credits.ts): one Durable Object per token, so a debit is
# atomic and a balance can never be overdrawn.
[[durable_objects.bindings]]
name = "CREDITS"
class_name = "CreditLedger"

# Single use of a payment (deploy/payment-claims.ts): one Durable Object per payment payload.
[[durable_objects.bindings]]
name = "PAYMENT_CLAIMS"
class_name = "PaymentClaim"

# v1 created the free-tier quota counter; v2 deletes it (v0.3 removed the free tier);
# v3 adds the prepaid credit ledger.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateCounter"]

[[migrations]]
tag = "v2"
deleted_classes = ["RateCounter"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["CreditLedger"]

# v4 adds the payment claims (single use of each x402 payment).
[[migrations]]
tag = "v4"
new_sqlite_classes = ["PaymentClaim"]

# Unpaid requests to paid routes and /status: at most 60 a minute per IP (Workers Rate Limiting).
[[ratelimits]]
name = "UNPAID_LIMITER"
namespace_id = "4021"
simple = { limit = 60, period = 60 }

# Workers Logs: the Worker's console.error/warn/log on failure paths (no tokens, no request bodies).
[observability]
enabled = true

# Embedded threat-feed hash sets (src/data/*.bin) are bundled as ArrayBuffer Data modules.
# Keep this table LAST: TOML keys written after a [[table]] header belong to that table.
[[rules]]
type = "Data"
globs = ["**/*.bin"]
fallthrough = false
